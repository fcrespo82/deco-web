# Deco Dashboard — exemplo de implantação na LAN.
# NÃO publique esta porta na internet (veja o README).
#
# Não edite este arquivo para a sua instalação: copie
# compose.override.example.yaml para compose.override.yaml (fora do git) e
# ajuste lá. O compose mescla os dois automaticamente.
services:
  deco-web:
    build: .
    image: deco-web:latest
    container_name: deco-web
    restart: unless-stopped
    ports:
      # Prefira ligar só ao IP da máquina na LAN, ex.: "192.168.68.10:8080:8080".
      - "8080:8080"
    environment:
      DECO_HOST: 192.168.68.1
      DECO_PASSWORD_FILE: /run/secrets/deco_password
      UI_PASSWORD_FILE: /run/secrets/ui_password
      POLL_INTERVAL: 90
      # Escrita (reservas) e operações perigosas (reiniciar/Wi-Fi): habilite
      # no compose.override.yaml.
      # DECO_ALLOW_WRITE: 1
      # DECO_ALLOW_DANGEROUS: 1
      TZ: America/Sao_Paulo
      # PUBLIC_URL: http://192.168.68.10:8080
      # NOTIFY_NTFY_URL: https://ntfy.sh/um-topico-dificil-de-adivinhar
      # NOTIFY_TELEGRAM_CHAT_ID: "123456789"
      # NOTIFY_TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
    secrets:
      - deco_password
      - ui_password
    volumes:
      - deco-web-data:/data
    # Repetido do Dockerfile: o podman-compose constrói em formato OCI, que
    # ignora o HEALTHCHECK da imagem.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # O encerramento espera o poll em andamento deslogar do Deco (até 60 s).
    stop_grace_period: 75s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  deco_password:
    file: ./secrets/deco_password
  ui_password:
    file: ./secrets/ui_password

volumes:
  deco-web-data:
