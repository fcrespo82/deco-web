<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>POC · Conexões Deco</title><style>body{margin:0;background:#1e1e2e;color:#cdd6f4;font:16px system-ui}header{padding:20px}p{color:#bac2de}svg{width:100%;height:78vh;touch-action:none}g[data-node]{cursor:grab}button{padding:8px 14px;background:#45475a;color:#cdd6f4;border:0;border-radius:6px}</style><header><b>POC · Corredores independentes</b><p>Arraste os equipamentos. Cabos contínuos; Wi-Fi tracejado. Saídas por cima ou por baixo conforme o destino; os números nas bordas identificam as portas. As linhas desviam dos cartões.</p><button id="reset">Restaurar posições</button></header><svg viewBox="0 0 1100 680"></svg><script type="module">
import {routeCables} from '/src/lib/cable-routing.ts';
const initial=[{id:'switch',name:'Switch da sala de entrada',x:460,y:300,ports:8},{id:'gateway',name:'Deco gateway',x:170,y:120,ports:3},{id:'tv',name:'TV sala',x:840,y:490,ports:1},{id:'pc',name:'Computador',x:180,y:490,ports:1},{id:'nas',name:'Servidor',x:850,y:110,ports:2},{id:'wifi',name:'Deco · Wi-Fi',x:530,y:590,ports:2}];
let nodes=structuredClone(initial),drag=null;
const links=[['switch',0,'gateway',0],['switch',1,'pc',0],['switch',2,'tv',0],['switch',3,'nas',0],['switch',4,'nas',1],['gateway',null,'wifi',null]];
const svg=document.querySelector('svg');
function render(){const boxes=nodes.map(n=>({id:n.id,x:n.x-100,y:n.y-45,width:200,height:90}));const get=(id,port,other)=>{const n=nodes.find(n=>n.id===id),up=nodes.find(n=>n.id===other).y<n.y;return {nodeId:id,x:port===null?n.x:n.x+(port-(n.ports-1)/2)*20,y:n.y+(up?-45:45),side:up?'top':'bottom'}};const wired=links.slice(0,-1).map(([a,p,b,q])=>({a:get(a,p,b),b:get(b,q,a)}));const routes=routeCables(wired,boxes,'adaptive');svg.innerHTML=routes.map(r=>`<path d="${r.d}" fill="none" stroke="#cba6f7" stroke-width="2"/>`).join('');const [a,,b]=links.at(-1);const wa=get(a,null,b),wb=get(b,null,a);svg.innerHTML+=`<path d="M ${wa.x} ${wa.y} L ${wb.x} ${wb.y}" fill="none" stroke="#89b4fa" stroke-width="2" stroke-dasharray="7 5"/>`;for(const n of nodes){svg.innerHTML+=`<g data-node="${n.id}"><rect x="${n.x-100}" y="${n.y-45}" width="200" height="90" rx="9" fill="#313244" stroke="#6c7086"/><text x="${n.x}" y="${n.y-20}" text-anchor="middle" fill="#cdd6f4" font-size="12">${n.name}</text>${Array.from({length:n.ports},(_,i)=>{const x=n.x+(i-(n.ports-1)/2)*20;const terminals=wired.flatMap(l=>[l.a,l.b]).filter(a=>a.nodeId===n.id&&a.x===x);return `${terminals.map(a=>`<circle cx="${x}" cy="${a.y}" r="3" fill="#cba6f7"/><text x="${x}" y="${a.y+(a.side==='top'?-9:16)}" text-anchor="middle" fill="#cdd6f4" font-size="10" paint-order="stroke" stroke="#1e1e2e" stroke-width="4">${i+1}</text>`).join('')}<rect x="${x-6}" y="${n.y+10}" width="12" height="10" rx="1" fill="#1e1e2e" stroke="#bac2de"/><text x="${x}" y="${n.y+32}" text-anchor="middle" fill="#cdd6f4" font-size="9" paint-order="stroke" stroke="#313244" stroke-width="3">${i+1}</text>`}).join('')}</g>`;}}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}svg.onpointerdown=e=>{const el=e.target.closest('[data-node]');if(el){const n=nodes.find(n=>n.id===el.dataset.node),p=point(e);drag={n,dx:p.x-n.x,dy:p.y-n.y};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(drag){const p=point(e);drag.n.x=p.x-drag.dx;drag.n.y=p.y-drag.dy;render()}};svg.onpointerup=svg.onpointercancel=()=>drag=null;document.querySelector('button').onclick=()=>{nodes=structuredClone(initial);render()};render();
</script></html>
